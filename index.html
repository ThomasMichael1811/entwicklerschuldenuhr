<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwicklerschuldenuhr</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 1rem auto; padding: 0 1rem; }
  .errors { color: #b00020; }
  #participants { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  label.person { padding: .1rem 0; }
  h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  h2 { font-size: 1rem; margin: .8rem 0 .3rem; }
  .quick button { margin-right: .3rem; }
  #calc, #start { font-size: 1.1rem; padding: .5rem 1rem; margin-top: .5rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Entwicklerschuldenuhr</h1>

<section id="meeting">
  <h2>Personen</h2>
  <p>CSV mit Kopfzeile <code>Name;Stundensatz</code> (Trennzeichen <code>;</code> oder <code>,</code>, Dezimalkomma erlaubt).</p>
  <input id="file" type="file" accept=".csv,text/csv,text/plain">
  <div id="errors" class="errors"></div>
  <h2>Teilnehmer</h2>
  <div id="participants"></div>
  <p id="meeting-empty" hidden>Noch keine Personen geladen. Bitte oben eine CSV wählen.</p>
  <h2>Dauer</h2>
  <p>
    <input id="minutes" type="number" min="1" step="1" value="10"> Minuten
  </p>
  <p class="quick">
    <button data-min="5">5</button><button data-min="10">10</button><button data-min="15">15</button><button data-min="30">30</button><button data-min="60">60</button>
  </p>
  <button id="calc">Kosten anzeigen</button>
  <button id="start">Start (live)</button>
</section>



<script>
const STORAGE_KEY = 'entwicklerschuldenuhr.csv';
const euro = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const $ = id => document.getElementById(id);

let persons = []; // { name, cents }

// --- CSV -------------------------------------------------------------------

function decode(buffer) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
  catch { return new TextDecoder('windows-1252').decode(buffer); }
}

function parseRate(text) {
  const t = text.replace(/[€\s]/g, '').replace(',', '.');
  return /^\d+(\.\d+)?$/.test(t) ? Math.round(parseFloat(t) * 100) : null;
}

function parseCsv(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  const first = lines.find(l => l.trim());
  const delimiter = first && first.includes(';') ? ';' : ',';
  const people = [], errors = [];
  let headerSeen = false;
  lines.forEach((line, i) => {
    if (!line.trim()) return;
    const [name = '', rate = ''] = line.split(delimiter).map(s => s.trim().replace(/^"|"$/g, ''));
    if (!headerSeen) {
      headerSeen = true;
      if (parseRate(rate) === null) return; // Kopfzeile
    }
    const cents = parseRate(rate);
    if (!name || cents === null) errors.push(`Zeile ${i + 1}: "${line}" ist ungültig (erwartet: Name${delimiter}Stundensatz)`);
    else people.push({ name, cents });
  });
  return { people, errors };
}

function load(text) {
  const { people, errors } = parseCsv(text);
  persons = people;
  $('errors').innerHTML = '';
  errors.forEach(e => { const p = document.createElement('p'); p.textContent = e; $('errors').append(p); });
  renderParticipants();
}

// --- Rendering -------------------------------------------------------------

function renderParticipants() {
  const box = $('participants');
  const checked = new Set([...box.querySelectorAll('input:checked')].map(i => i.value));
  box.innerHTML = '';
  persons.forEach((p, i) => {
    const label = document.createElement('label'); label.className = 'person';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = i; cb.checked = checked.has(String(i));
    label.append(cb, ' ', p.name); box.append(label);
  });
  $('meeting-empty').hidden = persons.length > 0;
}

// --- Events ----------------------------------------------------------------

$('file').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = decode(await file.arrayBuffer());
  try { localStorage.setItem(STORAGE_KEY, text); } catch {}
  load(text);
  e.target.value = '';
};

document.querySelectorAll('.quick button').forEach(b => b.onclick = () => $('minutes').value = b.dataset.min);

const selected = () => [...$('participants').querySelectorAll('input:checked')].map(i => persons[i.value]);

$('start').onclick = () => {
  const chosen = selected();
  if (!chosen.length) { alert('Bitte Teilnehmer wählen.'); return; }
  const centsPerHour = chosen.reduce((s, p) => s + p.cents, 0);
  const win = window.open('', 'live', 'popup,width=700,height=400');
  if (!win) { alert('Das Fenster wurde vom Browser blockiert. Bitte Pop-ups für diese Seite erlauben.'); return; }
  win.document.open();
  win.document.write(`<!doctype html><html lang="de"><meta charset="utf-8"><title>Meeting läuft</title>
<body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
<div id="sum" style="font-size:min(20vw,28vh);font-weight:bold;line-height:1"></div>
<div id="info" style="font-size:min(4vw,6vh);margin-top:.5em"></div>
<button id="stop" style="font-size:1.1rem;margin-top:1em;padding:.4rem 1rem">Stopp</button>
<script>
const rate = ${centsPerHour}, n = ${chosen.length}, t0 = Date.now();
const fmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
let timer;
function tick() {
  const sec = Math.floor((Date.now() - t0) / 1000);
  document.getElementById('sum').textContent = fmt.format(Math.round(rate * sec / 3600) / 100);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0'), ss = String(sec % 60).padStart(2, '0');
  document.getElementById('info').textContent = n + ' Teilnehmer, ' + mm + ':' + ss;
}
tick(); timer = setInterval(tick, 1000);
document.getElementById('stop').onclick = () => { tick(); clearInterval(timer); document.getElementById('stop').remove(); };
<\/script></body></html>`);
  win.document.close();
  win.focus();
};

$('calc').onclick = () => {
  const minutes = parseFloat($('minutes').value);
  const chosen = selected();
  if (!chosen.length || !(minutes > 0)) { alert('Bitte Teilnehmer wählen und eine Dauer größer 0 eingeben.'); return; }
  const centsPerHour = chosen.reduce((s, p) => s + p.cents, 0);
  const total = Math.round(centsPerHour * minutes / 60);
  const sum = euro.format(total / 100);
  const win = window.open('', 'kosten', 'popup,width=700,height=350');
  if (!win) { alert('Das Fenster wurde vom Browser blockiert. Bitte Pop-ups für diese Seite erlauben.'); return; }
  win.document.open();
  win.document.write(`<!doctype html><html lang="de"><meta charset="utf-8"><title>Meetingkosten</title>
<body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
<div style="font-size:min(22vw,30vh);font-weight:bold;line-height:1">${sum}</div>
<div style="font-size:min(4vw,6vh);margin-top:.5em">${chosen.length} Teilnehmer, ${minutes} Minuten</div></body></html>`);
  win.document.close();
  win.focus();
};

try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) load(saved); } catch {}
renderParticipants();
</script>
</body>
</html>
